# Fly.io config for finance-tracker.
# `fly launch` will let you pick a unique app name + region and update this file.
# Data lives in Supabase, so no Fly volume is needed.

app = "finance-tracker"           # change to a unique name (fly launch prompts you)
primary_region = "iad"            # pick the region nearest you (e.g. lhr, sjc, syd)

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always running so the "5-second log" never hits a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"                # bump to 512mb if you ever see OOM in `fly logs`
